[flake8]
# Task 10.3: the project's arcade-style code uses long, explanatory comment
# lines and descriptive names, so the default 79-char limit is impractical.
# 100 keeps lines readable on a normal editor while giving comments room.
max-line-length = 100
# E203/W503 conflict with common formatting and are safe to ignore; E731
# (assigning a lambda) is used deliberately for the small screen-action maps.
extend-ignore = E203, W503
exclude =
    venv,
    graphify-out,
    scratchpad,
    .git,
    __pycache__

[mypy]
# Task 10.1: strict-ish typing. mazegenerator ships no stubs, so missing
# imports are ignored rather than failing the run.
ignore_missing_imports = True
warn_return_any = True
warn_unused_ignores = True
disallow_untyped_defs = True
check_untyped_defs = True
